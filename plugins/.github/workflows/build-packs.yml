# MODELO — copie para o repositório de plugins quando ele existir (.github/workflows/).
# Não roda nada daqui: é só um esqueleto. Gera um .moonpack por versão exata do motor e publica numa release.
name: build-packs
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  html5:                      # RPG Maker / Tyrano: só empacota (sem compilar nada)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [rpgm, tyrano]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zip jq
      - run: tools/pack.sh ${{ matrix.plugin }} --out dist --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with: { name: "packs-${{ matrix.plugin }}", path: dist }
  native:                     # Ren'Py / Godot: um job por versão exata, chamando o script de build de cada motor
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { motor: renpy, versao: "8.4.1", script: "renpy/pack_runtime.sh" }
          - { motor: renpy, versao: "8.3.7", script: "renpy/pack_runtime.sh" }
          - { motor: godot, versao: "4.7.2", script: "godot/build_engine.sh" }
          - { motor: godot, versao: "4.6.1", script: "godot/build_engine.sh" }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zip jq
      # o script de cada motor produz os arquivos do pacote (.so/.dex) em <motor>/out/<versao>/
      - run: ${{ matrix.script }} ${{ matrix.versao }}
      - run: tools/pack.sh ${{ matrix.motor }} --versao-motor ${{ matrix.versao }} --out dist --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with: { name: "pack-${{ matrix.motor }}-${{ matrix.versao }}", path: dist }
  release:
    needs: [html5, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      # junta os index.json parciais (jq) e publica os .moonpack + index.json na release
      - run: jq -s '{versao:1, nome:"Plugins do M.O.O.N", plugins:(map(.plugins)|add|sort_by(.id))}' dist/index.json > index.json || true
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*.moonpack\nindex.json" }
