# M.O.O.N — build do APK de release (so gera arquivo; nada e publicado fora da release da tag).
#
# Dispara em: push de tag v* (ex.: v0.3.0) e manualmente (workflow_dispatch).
# Saida: moon-<versao>-release.apk anexado na release da tag (so em push de tag).
#
# Secrets do repositorio (Settings > Secrets and variables > Actions) a criar:
#   MOON_KEYSTORE_B64  keystore de release em base64 (sem quebras de linha)
#   MOON_KEY_ALIAS     alias da chave dentro do .jks
#   MOON_KS_PASS       senha do .jks
#   MOON_KEY_PASS      (opcional) senha da chave; se vazio, usa MOON_KS_PASS
#
# Gerar o base64 (a partir da keystore, que NUNCA entra no git):
#   base64 -w0 moon-release.jks > moon-release.jks.b64
#   # cole o conteudo de moon-release.jks.b64 no secret MOON_KEYSTORE_B64
#
# Layout esperado (igual ao local): OFS/Moon (este repo) e OFS/Obsidian-Fault-Script,
# porque build.sh procura o OFS em ../../Obsidian-Fault-Script.
name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    name: APK release (android)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout M.O.O.N (pasta OFS/Moon)
        uses: actions/checkout@v4
        with:
          path: OFS/Moon

      - name: Checkout OFS (ao lado)
        uses: actions/checkout@v4
        with:
          repository: Samwns/Obsidian-Fault-Script
          path: OFS/Obsidian-Fault-Script

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK, build-tools 37, platform 35, NDK 29
        uses: android-actions/setup-android@v3
        with:
          # o padrão tenta instalar o pacote 'tools', que não existe mais
          packages: ''

      - name: Instalar pacotes do SDK e ferramentas
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;37.0.0" "ndk;29.0.14206865"
          sudo apt-get update
          sudo apt-get install -y clang zip unzip jq

      - name: Decodificar keystore (fora do repo)
        env:
          MOON_KEYSTORE_B64: ${{ secrets.MOON_KEYSTORE_B64 }}
          MOON_KEY_ALIAS: ${{ secrets.MOON_KEY_ALIAS }}
          MOON_KS_PASS: ${{ secrets.MOON_KS_PASS }}
          MOON_KEY_PASS: ${{ secrets.MOON_KEY_PASS }}
        run: |
          KS="$RUNNER_TEMP/moon-release.jks"
          if [ -z "$MOON_KEYSTORE_B64" ]; then
            echo "::error::Secret MOON_KEYSTORE_B64 vazio ou inexistente."; exit 1
          fi
          # tolera quebras de linha/espaços colados no secret
          printf '%s' "$MOON_KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$KS" 2>/dev/null || {
            echo "::error::MOON_KEYSTORE_B64 não é base64 válido. Gere com: base64 -w0 moon-release.jks"; exit 1; }
          chmod 600 "$KS"
          if ! keytool -list -keystore "$KS" -storepass "$MOON_KS_PASS" >/dev/null 2>&1; then
            echo "::error::Keystore decodificada, mas a senha MOON_KS_PASS não abre (ou o arquivo não é uma keystore)."; exit 1
          fi
          {
            echo "MOON_KEYSTORE=$KS"
            echo "MOON_KEY_ALIAS=$MOON_KEY_ALIAS"
            echo "MOON_KS_PASS=$MOON_KS_PASS"
            echo "MOON_KEY_PASS=$MOON_KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Baixar e instalar OFS oficial (release do repositório)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/ofs-deb"
          if ! gh release download -R Samwns/Obsidian-Fault-Script -p "ofs-debian-ubuntu-x64-installer-*.deb" --dir "$RUNNER_TEMP/ofs-deb" 2>/dev/null; then
            echo "gh download falhou; tentando via curl..."
            DEB_URL=$(curl -sL https://api.github.com/repos/Samwns/Obsidian-Fault-Script/releases/latest | grep "browser_download_url.*debian-ubuntu.*\.deb" | cut -d '"' -f 4)
            curl -sL "$DEB_URL" -o "$RUNNER_TEMP/ofs-deb/ofs-installer.deb"
          fi
          sudo dpkg -i "$RUNNER_TEMP/ofs-deb"/*.deb
          rm -rf "$RUNNER_TEMP/ofs-deb"
          echo "OFSCC=/usr/lib/ofs/ofscc" >> "$GITHUB_ENV"
          echo "OFS_RUNTIME=/usr/lib/ofs/magma.o" >> "$GITHUB_ENV"
          ofs version
          ofscc --version | head -2

      - name: Build release
        working-directory: OFS/Moon/moon
        run: |
          ./build.sh android release
          ls -lh build/android/moon-*-release.apk

      - name: Remover keystore temporaria
        if: always()
        run: rm -f "$RUNNER_TEMP/moon-release.jks"

      - name: Upload APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: moon-release-apk
          path: |
            OFS/Moon/moon/build/android/moon-*-release.apk

      - name: Anexar APK na release da tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OFS/Moon/moon/build/android/moon-*-release.apk
